[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sofia_voice_agent"
version = "0.1.0"
description = "Sofia voice Agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sofia-voice-agent = "voice_agent.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
